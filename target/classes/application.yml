# ============================================================
# TierTagger API - Configuração padrão (todos os profiles)
# ============================================================
spring:
  application:
    name: tiertagger-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tiertagger}
    username: ${DB_USERNAME:tiertagger}
    password: ${DB_PASSWORD:tiertagger}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

# Atuador (healthcheck)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# ============================================================
# TierTagger App
# ============================================================
tiertagger:
  app-version: ${APP_VERSION:1.0.0}
  client-latest-version: ${CLIENT_LATEST_VERSION:1.0.0}
  client-download-url: ${CLIENT_DOWNLOAD_URL:}
  jwt:
    # Chave em Base64 com no mínimo 32 bytes (256 bits)
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtaW5zZWN1cmUtZGVmYXVsdC1zZWNyZXQta2V5LWJhc2U2NC0w}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  seed-admin:
    username: ${SEED_ADMIN_USERNAME:admin}
    password: ${SEED_ADMIN_PASSWORD:admin123}
    display-name: ${SEED_ADMIN_DISPLAY:Administrador}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  rate-limit:
    # Limite global por IP: requests por janela
    capacity: ${RATE_LIMIT_CAPACITY:120}
    # Janela em minutos
    window-minutes: ${RATE_LIMIT_WINDOW_MINUTES:1}
    # Rotas de escrita (POST) ficam restritas
    write-capacity: ${RATE_LIMIT_WRITE_CAPACITY:20}
  cache:
    # Duração do cache em minutos
    player-ttl-minutes: ${CACHE_PLAYER_TTL_MINUTES:10}
    metadata-ttl-minutes: ${CACHE_METADATA_TTL_MINUTES:60}
    max-size: ${CACHE_MAX_SIZE:10000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.tiertagger.api.controller

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.tiertagger: ${LOGGING_LEVEL_COM_TIERTAGGER:DEBUG}
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n"

