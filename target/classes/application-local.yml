# ============================================================
# TierTagger API - Profile Local (H2 em memória)
# Uso: mvn spring-boot:run -Dspring-boot.run.profiles=local
# ============================================================
spring:
  datasource:
    url: jdbc:h2:mem:tiertagger;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

tiertagger:
  jwt:
    secret: Y2hhbmdlLW1lLXRoaXMtaXMtaW5zZWN1cmUtZGVmYXVsdC1zZWNyZXQta2V5LWJhc2U2NC0w
    access-ttl-minutes: 1440
    refresh-ttl-days: 7
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080

logging:
  level:
    root: INFO
    com.tiertagger: DEBUG

